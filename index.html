<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  :root{
    --ink:#1b1b1f; --muted:#6b6b76; --line:#d9d9e0; --bg:#f6f6f4;
    --accent:#1f5f4e; --accent-soft:#e8f1ee; --danger:#a33;
  }
  *{box-sizing:border-box}
  #root{direction:rtl; font-family:"Assistant","Segoe UI",Arial,sans-serif; color:var(--ink); max-width:820px; margin:0 auto; padding:4px 2px 40px}
  h1{font-size:22px; margin:0 0 4px}
  h2{font-size:16px; margin:22px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line)}
  p.sub{color:var(--muted); font-size:14px; margin:0 0 18px}
  .tabs{display:flex; gap:6px; margin-bottom:18px; background:var(--bg); padding:5px; border-radius:10px}
  .tabs button{flex:1; padding:9px; border:0; background:transparent; border-radius:7px; font-size:14px; cursor:pointer; font-family:inherit; color:var(--muted)}
  .tabs button.on{background:#fff; color:var(--ink); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .full{grid-column:1/-1}
  label{display:block; font-size:13px; color:var(--muted); margin-bottom:5px}
  input,select,textarea{width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font-size:15px; font-family:inherit; background:#fff}
  textarea{min-height:76px; resize:vertical; line-height:1.6}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--accent-soft); border-color:var(--accent)}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 18px; border-radius:9px; border:0; background:var(--accent); color:#fff; font-size:15px; font-family:inherit; font-weight:600; cursor:pointer}
  .btn.ghost{background:#fff; color:var(--ink); border:1px solid var(--line); font-weight:500}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .row{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px}
  .linkbox{margin-top:16px; background:var(--accent-soft); border:1px solid #cfe0da; border-radius:10px; padding:14px}
  .linkbox code{display:block; word-break:break-all; font-size:11px; color:#31554b; background:#fff; padding:9px; border-radius:6px; max-height:90px; overflow:auto; margin:8px 0}
  .note{font-size:12.5px; color:var(--muted); line-height:1.6}
  .sigwrap{border:1px dashed #bdbdc7; border-radius:10px; background:#fff; position:relative}
  canvas#sig{width:100%; height:170px; display:block; touch-action:none; border-radius:10px}
  .sighint{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#bbb; font-size:14px; pointer-events:none}
  .chk{display:flex; gap:9px; align-items:flex-start; font-size:14.5px; line-height:1.55; background:var(--bg); padding:12px; border-radius:9px}
  .chk input{width:18px; height:18px; margin-top:2px; flex:0 0 auto}
  .err{color:var(--danger); font-size:13.5px; margin-top:10px}
  .ok{background:#eef7f2; border:1px solid #cfe6da; padding:14px; border-radius:10px; font-size:14.5px; margin-top:16px}
  /* ---- the printable letter ---- */
  #letter{width:794px; min-height:1123px; background:#fff; padding:70px 80px; direction:rtl; color:#000;
          font-family:"Assistant","Segoe UI",Arial,sans-serif; font-size:17px; line-height:2.1}
  #letter .school{text-align:center; font-size:19px; font-weight:700; line-height:1.6; margin-bottom:46px}
  #letter .date{text-align:right; margin-bottom:26px}
  #letter .body p{margin:0 0 6px}
  #letter .divider{text-align:center; letter-spacing:5px; color:#444; margin:70px 0 34px}
  #letter .fld{border-bottom:1px solid #000; display:inline-block; min-width:150px; text-align:center; padding:0 8px}
  #letter .sigline{display:flex; align-items:flex-end; gap:14px; margin-top:34px}
  #letter .sigbox{border-bottom:1px solid #000; width:230px; height:70px; display:flex; align-items:flex-end; justify-content:center}
  #letter .sigbox img{max-height:66px; max-width:100%}
  .stage{position:fixed; right:-3000px; top:0}
  @media (max-width:620px){ .grid{grid-template-columns:1fr} }
</style>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const root = document.getElementById('root');
  const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];

  /* ---------- encoding helpers (Hebrew-safe base64url) ---------- */
  function enc(obj){
    const bytes = new TextEncoder().encode(JSON.stringify(obj));
    let bin=''; bytes.forEach(b=>bin+=String.fromCharCode(b));
    return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  function dec(str){
    try{
      const b = atob(str.replace(/-/g,'+').replace(/_/g,'/'));
      const arr = Uint8Array.from(b, c=>c.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(arr));
    }catch(e){ return null; }
  }
  const heDate = iso => { if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${+d}.${+m}.${y.slice(2)}`; };
  const dayName = iso => iso ? DAYS[new Date(iso+'T00:00').getDay()] : '';
  const esc = s => (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  /* ---------- state ---------- */
  let cfg = null;                       // activity config (from teacher / URL)
  let mode = 'teacher';
  const hash = location.hash.match(/[#&]f=([^&]+)/);
  if(hash){ const d = dec(hash[1]); if(d){ cfg = d; mode='parent'; } }

  /* ---------- teacher view ---------- */
  function teacherView(){
    const today = new Date().toISOString().slice(0,10);
    root.innerHTML = `
      <h1>אישורי הורים ליציאה מבית הספר</h1>
      <p class="sub">המורה ממלא/ת את פרטי הפעילות, שולח/ת קישור להורים — וכל הורה מקבל מכתב PDF חתום ומלא.</p>
      <div class="tabs">
        <button class="on">1 · יצירת טופס (מורה)</button>
        <button id="toParent">2 · תצוגת ההורים</button>
      </div>
      <h2>פרטי בית הספר</h2>
      <div class="grid">
        <div class="full"><label>שם בית הספר (שורה 1)</label><input id="s1" value="בית הספר הממלכתי"></div>
        <div class="full"><label>שם בית הספר (שורה 2)</label><input id="s2" value='ע"ש הנרייטה סאלד ירושלים'></div>
      </div>
      <h2>פרטי הפעילות</h2>
      <div class="grid">
        <div><label>תאריך המכתב</label><input type="date" id="ldate" value="${today}"></div>
        <div><label>תאריך הפעילות</label><input type="date" id="adate" value="${today}"></div>
        <div><label>סוג הפעילות</label>
          <select id="atype">
            <option>סיור</option><option>למידת חוץ</option><option>טיול שנתי</option>
            <option>פעילות ספורט</option><option>הצגה / מופע</option><option>אחר</option>
          </select></div>
        <div><label>יעד / מקום</label><input id="place" placeholder="לדוגמה: חורשת הירח"></div>
        <div><label>שעת יציאה</label><input type="time" id="t1" value="08:30"></div>
        <div><label>שעת חזרה</label><input type="time" id="t2" value="12:30"></div>
        <div class="full"><label>נוסח המכתב להורים</label>
          <textarea id="body">במסגרת למידת חוץ נצא ביום {יום} {תאריך} לחורשת הירח.</textarea>
          <div class="note" style="margin-top:6px">אפשר להשתמש ב־{יום} {תאריך} {שעות} {מקום} והם יוחלפו אוטומטית.</div>
        </div>
        <div class="full"><label>חתימת השולח</label><input id="from" value="תודה, מחנכות ג'"></div>
        <div class="full"><label>הערות נוספות להורים (לא חובה)</label><input id="extra" placeholder="לדוגמה: יש להצטייד בכובע, מים ונעליים סגורות"></div>
      </div>
      <div class="row">
        <button class="btn" id="make">יצירת קישור להורים</button>
      </div>
      <div id="out"></div>`;

    $('#make').onclick = () => {
      const g = id => $('#'+id).value.trim();
      cfg = {s1:g('s1'), s2:g('s2'), ldate:g('ldate'), adate:g('adate'), atype:g('atype'),
             place:g('place'), t1:g('t1'), t2:g('t2'), body:g('body'), from:g('from'), extra:g('extra')};
      const link = location.origin + location.pathname + location.search + '#f=' + enc(cfg);
      $('#out').innerHTML = `
        <div class="linkbox">
          <strong>הקישור להורים מוכן ✓</strong>
          <code id="lnk">${esc(link)}</code>
          <div class="row" style="margin-top:4px">
            <button class="btn" id="copy">העתקת הקישור</button>
            <button class="btn ghost" id="prev">פתיחת טופס ההורים</button>
          </div>
          <p class="note" style="margin-top:10px">כל פרטי הפעילות מקודדים בתוך הקישור עצמו — אין צורך בשרת או במסד נתונים. שלחו אותו בוואטסאפ של הכיתה.</p>
        </div>`;
      $('#copy').onclick = async () => {
        try{ await navigator.clipboard.writeText(link); $('#copy').textContent='הועתק ✓'; }
        catch(e){ const r=document.createRange(); r.selectNode($('#lnk')); getSelection().removeAllRanges(); getSelection().addRange(r); $('#copy').textContent='סמנו והעתיקו ידנית'; }
      };
      $('#prev').onclick = () => { mode='parent'; parentView(); scrollTo(0,0); };
    };
    $('#toParent').onclick = () => { if(!cfg){ alert('צרו קודם את פרטי הפעילות ולחצו על "יצירת קישור להורים".'); return;} mode='parent'; parentView(); };
  }

  /* ---------- parent view ---------- */
  function parentView(){
    const hours = (cfg.t1&&cfg.t2) ? `בין השעות ${cfg.t1}–${cfg.t2}` : '';
    root.innerHTML = `
      <h1>אישור הורים · ${esc(cfg.atype||'פעילות')}</h1>
      <p class="sub">${esc(cfg.s1)} ${esc(cfg.s2)}</p>
      <div class="linkbox" style="background:var(--bg); border-color:var(--line)">
        <div style="line-height:1.9; font-size:15px">
          ${esc(letterText())}<br>
          ${hours?esc(hours)+'<br>':''}${cfg.extra?esc(cfg.extra):''}
        </div>
      </div>
      <h2>מילוי פרטים</h2>
      <div class="grid">
        <div><label>שם התלמיד/ה</label><input id="child" placeholder="שם מלא"></div>
        <div><label>כיתה</label><input id="cls" placeholder="לדוגמה: ג'2"></div>
        <div><label>שם ההורה</label><input id="pname" placeholder="שם מלא"></div>
        <div><label>טלפון ליצירת קשר</label><input id="phone" inputmode="tel" placeholder="050-0000000"></div>
        <div class="full"><label>הערות / רגישויות בריאותיות (לא חובה)</label><input id="notes"></div>
      </div>
      <h2>חתימת ההורה</h2>
      <div class="sigwrap"><canvas id="sig"></canvas><div class="sighint" id="hint">חתמו כאן באצבע או בעכבר</div></div>
      <div class="row" style="margin-top:10px"><button class="btn ghost" id="clr">ניקוי החתימה</button></div>
      <div style="margin-top:18px" class="chk">
        <input type="checkbox" id="agree">
        <label for="agree" style="margin:0; color:var(--ink)">הנני מאשר/ת לבני / בתי לצאת ל${esc(cfg.atype||'פעילות')}${cfg.place?' ב'+esc(cfg.place):''} ביום ${esc(dayName(cfg.adate))} ${esc(heDate(cfg.adate))}.</label>
      </div>
      <div class="row">
        <button class="btn" id="pdf">ייצוא מכתב PDF חתום</button>
        <button class="btn ghost" id="back">חזרה למסך המורה</button>
      </div>
      <div id="msg"></div>
      <div class="stage"><div id="letter"></div></div>`;

    setupSig();
    $('#clr').onclick = clearSig;
    $('#back').onclick = () => { mode='teacher'; history.replaceState(null,'',location.pathname+location.search); teacherView(); };
    $('#pdf').onclick = exportPDF;
  }

  function letterText(){
    return (cfg.body||'')
      .replace(/{יום}/g, dayName(cfg.adate))
      .replace(/{תאריך}/g, heDate(cfg.adate))
      .replace(/{שעות}/g, (cfg.t1&&cfg.t2)?`${cfg.t1}–${cfg.t2}`:'')
      .replace(/{מקום}/g, cfg.place||'');
  }

  /* ---------- signature pad ---------- */
  let ctx, drawing=false, hasSig=false, cv;
  function setupSig(){
    cv = $('#sig');
    const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio||1;
    cv.width = r.width*dpr; cv.height = r.height*dpr;
    ctx = cv.getContext('2d'); ctx.scale(dpr,dpr);
    ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#12233a';
    const pos = e => { const b=cv.getBoundingClientRect(); return [e.clientX-b.left, e.clientY-b.top]; };
    cv.addEventListener('pointerdown', e=>{ drawing=true; hasSig=true; $('#hint').style.display='none';
      cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...pos(e)); });
    cv.addEventListener('pointermove', e=>{ if(!drawing) return; ctx.lineTo(...pos(e)); ctx.stroke(); });
    ['pointerup','pointerleave','pointercancel'].forEach(t=>cv.addEventListener(t,()=>drawing=false));
  }
  function clearSig(){ ctx.clearRect(0,0,cv.width,cv.height); hasSig=false; $('#hint').style.display='flex'; }

  /* ---------- build + export ---------- */
  function buildLetter(d){
    const hours = (cfg.t1&&cfg.t2) ? `יציאה בשעה ${cfg.t1}, חזרה משוערת בשעה ${cfg.t2}.` : '';
    $('#letter').innerHTML = `
      <div class="school">${esc(cfg.s1)}<br>${esc(cfg.s2)}</div>
      <div class="date">${esc(heDate(cfg.ldate))}</div>
      <div class="body">
        <p>הורים יקרים,</p>
        <p>${esc(letterText())}</p>
        ${hours?`<p>${esc(hours)}</p>`:''}
        ${cfg.extra?`<p>${esc(cfg.extra)}</p>`:''}
        <p style="margin-top:22px">${esc(cfg.from)}</p>
      </div>
      <div class="divider">- - - - - - אישור - - - - - -</div>
      <div class="body">
        <p>הנני מאשר/ת לבני / בתי <span class="fld">${esc(d.child)}</span> כיתה <span class="fld" style="min-width:90px">${esc(d.cls)}</span></p>
        <p>לצאת ל${esc(cfg.atype)}${cfg.place?' ב'+esc(cfg.place):''} ביום ${esc(dayName(cfg.adate))} ${esc(heDate(cfg.adate))}.</p>
        ${d.notes?`<p>הערות: ${esc(d.notes)}</p>`:''}
        ${d.phone?`<p>טלפון ליצירת קשר: ${esc(d.phone)}</p>`:''}
        <div class="sigline">
          <div>שם ההורה: <span class="fld">${esc(d.pname)}</span></div>
          <div style="display:flex; align-items:flex-end; gap:10px">חתימת ההורה:
            <span class="sigbox"><img src="${d.sig}"></span></div>
        </div>
      </div>`;
  }

  async function exportPDF(){
    const d = {child:$('#child').value.trim(), cls:$('#cls').value.trim(), pname:$('#pname').value.trim(),
               phone:$('#phone').value.trim(), notes:$('#notes').value.trim()};
    const msg = $('#msg');
    if(!d.child || !d.pname){ msg.innerHTML='<div class="err">נא למלא את שם התלמיד/ה ואת שם ההורה.</div>'; return; }
    if(!hasSig){ msg.innerHTML='<div class="err">נא לחתום במסגרת החתימה.</div>'; return; }
    if(!$('#agree').checked){ msg.innerHTML='<div class="err">נא לסמן את תיבת האישור.</div>'; return; }
    msg.innerHTML='<div class="note">מכין את המכתב…</div>';
    d.sig = cv.toDataURL('image/png');
    buildLetter(d);
    await new Promise(r=>setTimeout(r,60));
    try{
      const canvas = await html2canvas($('#letter'), {scale:2, backgroundColor:'#ffffff'});
      const {jsPDF} = window.jspdf;
      const pdf = new jsPDF('p','mm','a4');
      const w = 210, h = canvas.height*w/canvas.width;
      pdf.addImage(canvas.toDataURL('image/jpeg',0.95),'JPEG',0,0,w,Math.min(h,297));
      pdf.save(`אישור_הורים_${d.child}.pdf`);
      msg.innerHTML='<div class="ok">המכתב נוצר והורד ✓ אפשר לשלוח אותו למורה.</div>';
    }catch(e){
      msg.innerHTML='<div class="err">ההורדה נכשלה. נסו לפתוח את הקובץ בדפדפן רגיל.</div>';
    }
  }

  mode==='parent' ? parentView() : teacherView();
})();
</script>
