<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מערכת אישורי הורים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#f4f4f1; --card:#ffffff; --ink:#17181c; --muted:#6c6c78; --line:#dedee6;
  --accent:#1f5f4e; --accent-ink:#ffffff; --soft:#e7f0ed; --danger:#a8362f; --warn:#8a6a1f; --warnbg:#fdf4dd;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16171a; --card:#1e2024; --ink:#eceef2; --muted:#9a9ca6; --line:#32353c;
    --accent:#3f9e84; --accent-ink:#0d1614; --soft:#1e2e2a; --danger:#e0776e; --warn:#e0c377; --warnbg:#2c2618;
  }
}
:root[data-theme="dark"]{
  --bg:#16171a; --card:#1e2024; --ink:#eceef2; --muted:#9a9ca6; --line:#32353c;
  --accent:#3f9e84; --accent-ink:#0d1614; --soft:#1e2e2a; --danger:#e0776e; --warn:#e0c377; --warnbg:#2c2618;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--ink); font-family:"Assistant","Segoe UI",Arial,sans-serif; font-size:15.5px; line-height:1.55}
.wrap{max-width:960px; margin:0 auto; padding:18px 16px 60px}
.topbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px}
.brand{font-weight:700; font-size:18px; margin-inline-end:auto}
.brand small{display:block; font-weight:400; font-size:12.5px; color:var(--muted)}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px}
h1{font-size:21px; margin:0 0 4px}
h2{font-size:16.5px; margin:0 0 12px}
h3{font-size:14.5px; margin:18px 0 8px; color:var(--muted); font-weight:600}
p.sub{color:var(--muted); font-size:13.5px; margin:0 0 16px}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px}
.full{grid-column:1/-1}
label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:4px}
input,select,textarea{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:9px; font:inherit; font-size:15px; background:var(--card); color:var(--ink)}
textarea{min-height:70px; resize:vertical; line-height:1.6}
input:focus,textarea:focus,select:focus{outline:2px solid var(--soft); border-color:var(--accent)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:10px 16px; border-radius:9px; border:0;
     background:var(--accent); color:var(--accent-ink); font:inherit; font-weight:600; cursor:pointer}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line); font-weight:500}
.btn.sm{padding:6px 11px; font-size:13.5px; font-weight:500}
.btn.dngr{background:transparent; color:var(--danger); border:1px solid var(--line)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.row{display:flex; gap:9px; flex-wrap:wrap; align-items:center}
.row.mt{margin-top:16px}
table{width:100%; border-collapse:collapse; font-size:14.5px}
th,td{text-align:right; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle}
th{font-size:12.5px; color:var(--muted); font-weight:600}
.tag{display:inline-block; padding:2px 9px; border-radius:999px; font-size:12.5px; font-weight:600}
.tag.ok{background:var(--soft); color:var(--accent); margin:0; padding:2px 9px; font-size:12.5px; border:0}
.tag.no{background:transparent; border:1px solid var(--line); color:var(--muted)}
.linkbox{background:var(--soft); border:1px solid var(--line); border-radius:11px; padding:13px}
.linkbox code{display:block; word-break:break-all; font-size:11.5px; background:var(--card); padding:8px; border-radius:7px; margin:8px 0; max-height:80px; overflow:auto}
.note{font-size:12.5px; color:var(--muted); line-height:1.6}
.warnbox{background:var(--warnbg); border:1px solid var(--line); color:var(--warn); border-radius:10px; padding:11px 13px; font-size:13.5px; margin-bottom:14px}
.err{color:var(--danger); font-size:13.5px; margin-top:9px}
.ok{background:var(--soft); border:1px solid var(--line); border-radius:10px; padding:12px; font-size:14px; margin-top:14px}
.empty{color:var(--muted); font-size:14px; padding:18px 0; text-align:center}
.listrow{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); flex-wrap:wrap}
.listrow .main{margin-inline-end:auto}
.listrow b{font-size:15.5px}
.listrow .meta{font-size:12.5px; color:var(--muted)}
.sigwrap{border:1px dashed var(--line); border-radius:11px; background:var(--card); position:relative}
canvas#sig{width:100%; height:165px; display:block; touch-action:none; border-radius:11px}
.sighint{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px; pointer-events:none}
.chk{display:flex; gap:9px; align-items:flex-start; font-size:14.5px; background:var(--bg); border:1px solid var(--line); padding:12px; border-radius:10px}
.chk input{width:18px; height:18px; margin-top:2px; flex:0 0 auto}
.stage{position:fixed; inset-inline-start:-4000px; top:0}
.tabs{display:flex; gap:6px; background:var(--bg); border:1px solid var(--line); padding:5px; border-radius:11px; margin-bottom:16px}
.tabs button{flex:1; padding:8px; border:0; background:transparent; border-radius:8px; font:inherit; font-size:14px; color:var(--muted); cursor:pointer}
.tabs button.on{background:var(--card); color:var(--ink); font-weight:600}
.scroll{overflow-x:auto}
/* ---- printable letter ---- */
#letter{width:794px; min-height:1123px; background:#fff; color:#000; padding:70px 78px; direction:rtl;
        font-family:"Assistant","Segoe UI",Arial,sans-serif; font-size:17px; line-height:2.05}
#letter .school{text-align:center; font-size:19px; font-weight:700; line-height:1.6; margin-bottom:44px}
#letter .ldate{margin-bottom:24px}
#letter p{margin:0 0 6px}
#letter .divider{text-align:center; letter-spacing:5px; margin:64px 0 32px}
#letter .fld{border-bottom:1px solid #000; display:inline-block; min-width:150px; text-align:center; padding:0 8px}
#letter .sigline{display:flex; align-items:flex-end; gap:22px; margin-top:30px; flex-wrap:wrap}
#letter .sigbox{border-bottom:1px solid #000; width:220px; height:66px; display:flex; align-items:flex-end; justify-content:center}
#letter .sigbox img{max-height:62px; max-width:100%}
#letter .stamp{margin-top:42px; font-size:12px; color:#555; border-top:1px dashed #999; padding-top:8px}
/* ---- committees module ---- */
.hero{text-align:center; padding:22px 16px 26px; margin-bottom:16px; border-radius:18px;
  background:linear-gradient(160deg, color-mix(in srgb,#9fd086 45%,var(--card)), color-mix(in srgb,#ffd34d 30%,var(--card)))}
.hero-school{font-size:13.5px; font-weight:600; color:var(--accent)}
.hero-title{font-size:34px; font-weight:700; margin:6px 0 4px; line-height:1.15}
.hero-title span{display:inline-block; font-size:18px; background:var(--accent); color:var(--accent-ink); padding:2px 12px; border-radius:9px; vertical-align:middle}
.hero-sub{font-weight:600; color:var(--muted)}
.step{display:inline-flex; width:26px; height:26px; border-radius:50%; background:var(--accent); color:var(--accent-ink); align-items:center; justify-content:center; font-size:14px; margin-inline-end:6px}
.cgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px}
.ccard{position:relative; background:var(--card); border:2px solid color-mix(in srgb,var(--c) 55%,var(--line)); border-radius:15px; overflow:hidden; display:flex; flex-direction:column; transition:transform .12s, box-shadow .12s}
.ccard.click{cursor:pointer}
.ccard.click:hover{transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,.08)}
.ccard.click:focus-visible{outline:3px solid var(--c); outline-offset:2px}
.ccard.picked{border-color:var(--c); box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 35%,transparent)}
.chead{display:flex; align-items:center; gap:8px; padding:9px 11px; background:color-mix(in srgb,var(--c) 16%,var(--card))}
.cnum{flex:0 0 28px; height:28px; border-radius:50%; background:var(--c); color:#fff; font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center}
.cname{font-weight:700; font-size:16.5px; flex:1}
.cicon{font-size:24px}
.cdesc{padding:9px 12px; font-size:13.5px; line-height:1.55; flex:1}
.cteach{padding:6px 12px 8px; font-size:13px; color:var(--muted); border-top:1px solid var(--line)}
.cteach b{color:var(--ink)}
.crank{position:absolute; top:7px; inset-inline-end:8px; background:var(--c); color:#fff; font-weight:700; padding:3px 11px; border-radius:999px; font-size:13.5px; box-shadow:0 2px 6px rgba(0,0,0,.18)}
.tray{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:14px}
.slot{position:relative; border:2px dashed var(--line); border-radius:12px; padding:9px 11px; min-height:62px; background:var(--bg)}
.slot.filled{border-style:solid; border-color:var(--c); background:color-mix(in srgb,var(--c) 12%,var(--card))}
.slotn{display:block; font-size:12px; color:var(--muted); font-weight:600}
.slotv{font-weight:700; font-size:15px}
.slotv.empty-v{font-weight:400; color:var(--muted); font-size:13.5px}
.slotx{position:absolute; top:6px; inset-inline-end:6px; border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:14px}
.sticky-submit{position:sticky; bottom:10px; z-index:5; box-shadow:0 6px 20px rgba(0,0,0,.12)}
.done{text-align:center}
.done-ic{font-size:44px}
.donelist{display:grid; gap:8px; justify-items:center}
.cchip{display:inline-flex; align-items:center; gap:5px; padding:3px 10px 3px 8px; border-radius:999px; font-size:13.5px; font-weight:600;
  background:color-mix(in srgb,var(--c) 15%,var(--card)); border:1px solid color-mix(in srgb,var(--c) 45%,var(--line)); white-space:nowrap}
.cchip.s{font-size:12.5px; padding:2px 8px}
.miss{display:flex; flex-wrap:wrap; gap:6px}
.miss span{background:var(--warnbg); color:var(--warn); border:1px solid var(--line); border-radius:999px; padding:2px 10px; font-size:13px}
.ptable td{vertical-align:top}
.ptable select{min-width:150px; padding:6px 8px; font-size:14px}
.tag.rk1{background:var(--soft); color:var(--accent)}
.tag.rk2{background:color-mix(in srgb,#3484cf 16%,var(--card)); color:color-mix(in srgb,#3484cf 80%,var(--ink))}
.tag.rk3{background:var(--warnbg); color:var(--warn)}
.tag.rk4{background:transparent; border:1px solid var(--line); color:var(--ink)}
.sumgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px}
.sumbox{border:1px solid var(--line); border-inline-start:5px solid var(--c); border-radius:11px; padding:9px 11px; background:var(--card)}
.sumbox.zero{opacity:.6}
.sumh{display:flex; justify-content:space-between; font-weight:700}
.sumh b{background:var(--c); color:#fff; border-radius:999px; min-width:26px; text-align:center; padding:0 7px}
.sumn{font-size:13px; margin-top:5px; line-height:1.6}
.cedit{border:1px solid var(--line); border-inline-start:5px solid var(--c); border-radius:11px; padding:11px; margin-bottom:10px}
#cprint{width:794px; background:#fff; color:#000; padding:46px 52px; direction:rtl; font-family:"Assistant","Segoe UI",Arial,sans-serif; font-size:14px; line-height:1.5}
#cprint .po{font-size:13px; color:#2f6b4f; font-weight:700}
#cprint h1{font-size:25px; margin:2px 0}
#cprint .pm{color:#444; margin-bottom:16px}
#cprint .pg{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
#cprint .pb{border:2px solid; border-radius:10px; overflow:hidden; break-inside:avoid}
#cprint .pbh{color:#fff; font-weight:700; padding:5px 10px; font-size:15px}
#cprint .pbh span{font-weight:400}
#cprint .pbt{font-size:12px; color:#555; padding:4px 10px 0}
#cprint ol{margin:4px 0 8px; padding-inline-start:28px}
#cprint .pun{margin-top:12px; padding:8px 10px; background:#fdf4dd; border-radius:8px}
#cprint h2{font-size:17px; margin:22px 0 8px}
#cprint table{font-size:12.5px}
#cprint th,#cprint td{padding:5px 6px; border-bottom:1px solid #ccc; color:#000}
@media (max-width:640px){ .grid,.grid3{grid-template-columns:1fr} .tray{grid-template-columns:1fr} .hero-title{font-size:27px} .cedit .full{grid-column:1/-1 !important} }
</style>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const app = $('#app');
const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rid = p => (p||'') + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const heDate = iso => { if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${+d}.${+m}.${y.slice(2)}`; };
const dayName = iso => iso ? DAYS[new Date(iso+'T00:00').getDay()] : '';
const norm = s => String(s||'').replace(/\s+/g,' ').trim();
const nowISO = () => new Date().toISOString();
const fmtTime = t => { try{ const d=new Date(t); return d.toLocaleDateString('he-IL')+' '+d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } };

async function sha(u,p){
  const buf = new TextEncoder().encode('slips-v1:'+u+':'+p);
  const h = await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ============ storage layer: Firebase Firestore, localStorage fallback ============ */
const Store = {
  fdb:null, fs:null, mode:'local', err:'',
  async init(){
    if(!window.FIREBASE_CONFIG || !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.indexOf('הדביקו')>-1){
      this.err = 'no-config'; this.mode='local'; return;
    }
    try{
      const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
      const [appMod, fsMod, authMod] = await Promise.all([
        import(V+'firebase-app.js'), import(V+'firebase-firestore.js'), import(V+'firebase-auth.js')
      ]);
      const app = appMod.initializeApp(FIREBASE_CONFIG);
      this.fdb = fsMod.getFirestore(app);
      this.fs = fsMod;
      try{ await authMod.signInAnonymously(authMod.getAuth(app)); }
      catch(e){ this.err='auth: '+(e.code||e.message); }
      await fsMod.getDoc(fsMod.doc(this.fdb,'app','ping')).catch(()=>{});
      this.mode = 'cloud';
    }catch(e){ this.err = (e && (e.code||e.message)) || 'init'; this.mode='local'; }
  },
  _doc(path){ return this.fs.doc.apply(null, [this.fdb].concat(path.split('/'))); },
  async get(path){
    if(this.fdb){ const s = await this.fs.getDoc(this._doc(path)); return s.exists() ? s.data() : null; }
    try{ const v = localStorage.getItem('slips:'+path); return v?JSON.parse(v):null; }catch(e){ return null; }
  },
  async set(path,data){
    if(this.fdb) return this.fs.setDoc(this._doc(path), data);
    try{ localStorage.setItem('slips:'+path, JSON.stringify(data)); }catch(e){ throw e; }
  },
  async del(path){
    if(this.fdb) return this.fs.deleteDoc(this._doc(path));
    try{ localStorage.removeItem('slips:'+path); }catch(e){}
  },
  async list(coll, field, value){
    if(this.fdb){
      const ref = this.fs.collection.apply(null, [this.fdb].concat(coll.split('/')));
      const q = field ? this.fs.query(ref, this.fs.where(field,'==',value)) : ref;
      const snap = await this.fs.getDocs(q);
      const out=[]; snap.forEach(d=>out.push(Object.assign({_id:d.id}, d.data())));
      return out;
    }
    const out=[];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith('slips:'+coll+'/')){
        const id = k.slice(('slips:'+coll+'/').length);
        if(id.indexOf('/')>-1) continue;
        try{ const o = JSON.parse(localStorage.getItem(k)); if(!field || o[field]===value) out.push(Object.assign({_id:id},o)); }catch(e){}
      }
    }
    return out;
  }
};

/* ============ download layer ============ */
async function saveFile(filename, blob){
  const url = URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000); return true;
}

/* ============ session ============ */
let ME = null;
const saveSession = u => { try{ sessionStorage.setItem('slips_me', u); }catch(e){} };
const clearSession = () => { try{ sessionStorage.removeItem('slips_me'); }catch(e){} };

/* ============ letter + pdf ============ */
function letterBody(ev){
  return (ev.body||'')
    .replace(/{יום}/g, dayName(ev.adate))
    .replace(/{תאריך}/g, heDate(ev.adate))
    .replace(/{שעות}/g, (ev.t1&&ev.t2)?`${ev.t1}–${ev.t2}`:'')
    .replace(/{מקום}/g, ev.place||'');
}
function buildLetter(ev, sub){
  const hours = (ev.t1&&ev.t2) ? `יציאה בשעה ${ev.t1}, חזרה משוערת בשעה ${ev.t2}.` : '';
  $('#letter').innerHTML = `
    <div class="school">${esc(ev.s1)}<br>${esc(ev.s2)}</div>
    <div class="ldate">${esc(heDate(ev.ldate))}</div>
    <p>הורים יקרים,</p>
    <p>${esc(letterBody(ev))}</p>
    ${hours?`<p>${esc(hours)}</p>`:''}
    ${ev.extra?`<p>${esc(ev.extra)}</p>`:''}
    <p style="margin-top:20px">${esc(ev.from)}</p>
    <div class="divider">- - - - - - אישור - - - - - -</div>
    <p>הנני מאשר/ת לבני / בתי <span class="fld">${esc(sub.child)}</span> כיתה <span class="fld" style="min-width:90px">${esc(sub.cls)}</span></p>
    <p>לצאת ל${esc(ev.atype)}${ev.place?' ב'+esc(ev.place):''} ביום ${esc(dayName(ev.adate))} ${esc(heDate(ev.adate))}.</p>
    ${sub.notes?`<p>הערות / רגישויות: ${esc(sub.notes)}</p>`:''}
    ${sub.phone?`<p>טלפון ליצירת קשר: ${esc(sub.phone)}</p>`:''}
    <div class="sigline">
      <div>שם ההורה: <span class="fld">${esc(sub.pname)}</span></div>
      <div style="display:flex; align-items:flex-end; gap:10px">חתימת ההורה:
        <span class="sigbox">${sub.sig?`<img src="${sub.sig}">`:''}</span></div>
    </div>
    <div class="stamp">הוגש דיגיטלית · ${esc(fmtTime(sub.submittedAt||nowISO()))} · מזהה: ${esc(sub._id||'—')}</div>`;
}
async function makePdfBlob(ev, sub){
  buildLetter(ev, sub);
  await new Promise(r=>setTimeout(r,60));
  const canvas = await html2canvas($('#letter'), {scale:2, backgroundColor:'#ffffff'});
  const {jsPDF} = window.jspdf;
  const pdf = new jsPDF('p','mm','a4');
  const w=210, h=canvas.height*w/canvas.width;
  pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',0,0,w,Math.min(h,297));
  return pdf.output('blob');
}
async function downloadSlip(ev, sub){
  const blob = await makePdfBlob(ev, sub);
  await saveFile(`אישור_${(sub.child||'הורה').replace(/\s+/g,'_')}.pdf`, blob);
}

/* ============ signature pad ============ */
let sctx, sdrawing=false, shas=false, scv;
function setupSig(){
  scv = $('#sig'); if(!scv) return;
  const r = scv.getBoundingClientRect(), dpr = window.devicePixelRatio||1;
  scv.width=r.width*dpr; scv.height=r.height*dpr;
  sctx = scv.getContext('2d'); sctx.scale(dpr,dpr);
  sctx.lineWidth=2.4; sctx.lineCap='round'; sctx.lineJoin='round'; sctx.strokeStyle='#12233a';
  const pos = e => { const b=scv.getBoundingClientRect(); return [e.clientX-b.left, e.clientY-b.top]; };
  scv.addEventListener('pointerdown', e=>{ sdrawing=true; shas=true; const h=$('#sighint'); if(h) h.style.display='none';
    scv.setPointerCapture(e.pointerId); sctx.beginPath(); sctx.moveTo.apply(sctx,pos(e)); });
  scv.addEventListener('pointermove', e=>{ if(!sdrawing) return; sctx.lineTo.apply(sctx,pos(e)); sctx.stroke(); });
  ['pointerup','pointerleave','pointercancel'].forEach(t=>scv.addEventListener(t,()=>sdrawing=false));
}
function clearSig(){ if(!sctx) return; sctx.clearRect(0,0,scv.width,scv.height); shas=false; const h=$('#sighint'); if(h) h.style.display='flex'; }
function sigData(){
  const max=560, ratio = Math.min(1, max/scv.width);
  const t=document.createElement('canvas'); t.width=scv.width*ratio; t.height=scv.height*ratio;
  t.getContext('2d').drawImage(scv,0,0,t.width,t.height);
  return t.toDataURL('image/png');
}

/* ============ boot ============ */
(async function boot(){
  await Store.init();
  const m = location.hash.match(/[#&]e=([A-Za-z0-9_\-]+)/);
  if(m){ return parentPage(m[1]); }
  const mc = location.hash.match(/[#&]c=([A-Za-z0-9_\-]+)/);
  if(mc){ return studentPage(mc[1]); }
  const mg = location.hash.match(/[#&]g=([A-Za-z0-9_\-]+)/);
  if(mg){ return gvanimStudent(mg[1]); }
  const cfg = await Store.get('app/config');
  if(!cfg || !cfg.bootstrapped) return setupPage();
  let saved=null; try{ saved = sessionStorage.getItem('slips_me'); }catch(e){}
  if(saved){
    const u = await Store.get('users/'+saved);
    if(u && u.active!==false){ ME = Object.assign({_id:saved}, u); return home(); }
  }
  loginPage();
})();

function modeBanner(){
  if(Store.mode==='cloud') return '';
  const why = Store.err==='no-config'
    ? 'לא הוגדרו פרטי החיבור ל-Firebase בראש הקובץ index.html.'
    : 'החיבור ל-Firebase נכשל ('+esc(Store.err)+'). בדקו את הגדרות הפרויקט, ההרשאות (Rules) וההתחברות האנונימית.';
  return `<div class="warnbox"><b>מצב מקומי — הנתונים נשמרים רק בדפדפן הזה.</b><br>${why}<br>
    טפסים שהורים ימלאו במכשיר אחר לא יגיעו לתיקייה עד שהחיבור יוגדר. ראו קובץ README.md.</div>`;
}

/* ============ setup (first run) ============ */
function setupPage(){
  app.innerHTML = `
    <div class="topbar"><div class="brand">מערכת אישורי הורים<small>התקנה ראשונית</small></div></div>
    ${modeBanner()}
    <div class="card">
      <h2>יצירת חשבון מנהל (ADMIN)</h2>
      <p class="sub">זהו המסך היחיד שנפתח פעם אחת. לאחר היצירה, רק המנהל יוכל להוסיף מורים ותיקיות.</p>
      <div class="grid">
        <div><label>שם משתמש</label><input id="u" value="admin" autocomplete="username"></div>
        <div><label>שם לתצוגה</label><input id="n" placeholder="שם המנהל/ת"></div>
        <div><label>סיסמה</label><input id="p" type="password" autocomplete="new-password"></div>
        <div><label>אימות סיסמה</label><input id="p2" type="password" autocomplete="new-password"></div>
        <div class="full"><label>שם המוסד</label><input id="org" value="בית הספר הממלכתי ע&quot;ש הנרייטה סאלד ירושלים"></div>
      </div>
      <div class="row mt"><button class="btn" id="go">יצירת החשבון</button></div>
      <div id="msg"></div>
    </div>`;
  $('#go').onclick = async () => {
    const u=norm($('#u').value), n=norm($('#n').value)||u, p=$('#p').value, p2=$('#p2').value;
    if(!u || p.length<4) return $('#msg').innerHTML='<div class="err">נא למלא שם משתמש וסיסמה באורך 4 תווים לפחות.</div>';
    if(p!==p2) return $('#msg').innerHTML='<div class="err">הסיסמאות אינן תואמות.</div>';
    await Store.set('users/'+u, {username:u, name:n, role:'admin', hash:await sha(u,p), active:true, createdAt:nowISO()});
    await Store.set('app/config', {bootstrapped:true, org:norm($('#org').value), createdAt:nowISO()});

/* ============ login ============ */
function loginPage(msg){
  app.innerHTML = `
    <div class="topbar"><div class="brand">מערכת אישורי הורים<small>כניסה למערכת</small></div></div>
    ${modeBanner()}
    <div class="card" style="max-width:420px; margin:0 auto">
      <h2>כניסה</h2>
      <div style="display:grid; gap:12px">
        <div><label>שם משתמש</label><input id="u" autocomplete="username"></div>
        <div><label>סיסמה</label><input id="p" type="password" autocomplete="current-password"></div>
      </div>
      <div class="row mt"><button class="btn" id="go" style="width:100%">כניסה</button></div>
      <div id="msg">${msg?`<div class="err">${esc(msg)}</div>`:''}</div>
    </div>`;
  const doLogin = async () => {
    const u=norm($('#u').value), p=$('#p').value;
    const rec = await Store.get('users/'+u);
    if(!rec || rec.active===false || rec.hash!==await sha(u,p))
      return $('#msg').innerHTML='<div class="err">שם משתמש או סיסמה שגויים.</div>';
    ME = Object.assign({_id:u}, rec); saveSession(u); home();
  };
  $('#go').onclick = doLogin;
  $('#p').onkeydown = e => { if(e.key==='Enter') doLogin(); };
  $('#u').focus();
}

function header(sub, extra){
  return `<div class="topbar">
    <div class="brand">מערכת אישורי הורים<small>${esc(sub||'')}</small></div>
    ${extra||''}
    <span class="note">${esc(ME? (ME.name||ME.username)+' · '+(ME.role==='admin'?'מנהל':'מורה') : '')}</span>
    <button class="btn ghost sm" id="out">יציאה</button>
  </div>`;
}
function bindOut(){ const b=$('#out'); if(b) b.onclick = () => { ME=null; clearSession(); loginPage(); }; }

function home(){ ME.role==='admin' ? adminPage() : teacherPage(ME.folderId); }

/* ============ admin ============ */
async function adminPage(tab){
  tab = tab || 'teachers';
  if(tab==='committees') return adminCommittees();
  if(tab==='gvanim') return adminGvanim();
  app.innerHTML = header('ניהול מערכת') + modeBanner() + `<div class="card"><div class="empty">טוען נתונים…</div></div>`;
  bindOut();
  const [users, folders, events, subs] = await Promise.all([
    Store.list('users'), Store.list('folders'), Store.list('events'), Store.list('submissions')
  ]);
  const cfg = await Store.get('app/config') || {};
  const cnt = f => events.filter(e=>e.folderId===f._id).length;
  const scnt = f => subs.filter(s=>s.folderId===f._id).length;

  const teachersHtml = () => {
    const list = users.filter(u=>u.role!=='admin');
    if(!list.length) return `<div class="empty">אין עדיין מורים במערכת.</div>`;
    return `<div class="scroll"><table><tr><th>מורה</th><th>שם משתמש</th><th>תיקייה</th><th>אירועים</th><th>סטטוס</th><th></th></tr>
      ${list.map(u=>{ const f=folders.find(x=>x._id===u.folderId);
        return `<tr><td><b>${esc(u.name||u.username)}</b></td><td class="note">${esc(u.username)}</td>
          <td>${f?esc(f.name):'<span class="note">— לא משויכת —</span>'}</td>
          <td>${f?cnt(f):0}</td>
          <td>${u.active===false?'<span class="tag no">מושבת</span>':'<span class="tag ok">פעיל</span>'}
            ${u.gvanimAdmin?'<span class="tag rk1">אחראי גוונים</span>':''}</td>
          <td class="row" style="gap:6px">
            <button class="btn ghost sm" data-gv="${esc(u.username)}">${u.gvanimAdmin?'ביטול אחראי גוונים':'מינוי לאחראי גוונים'}</button>
            <button class="btn ghost sm" data-pw="${esc(u.username)}">סיסמה</button>
            <button class="btn ghost sm" data-tg="${esc(u.username)}">${u.active===false?'הפעלה':'השבתה'}</button>
            <button class="btn dngr sm" data-del="${esc(u.username)}">מחיקה</button>
          </td></tr>`;}).join('')}
    </table></div>`;
  };
  const foldersHtml = () => {
    if(!folders.length) return `<div class="empty">אין עדיין תיקיות.</div>`;
    return folders.map(f=>{ const owner = users.find(u=>u.folderId===f._id);
      return `<div class="listrow"><div class="main"><b>${esc(f.name)}</b>
        <div class="meta">${owner?('מורה: '+esc(owner.name||owner.username)):'ללא מורה משויך'} · ${cnt(f)} אירועים · ${scnt(f)} אישורים</div></div>
        <button class="btn ghost sm" data-open="${esc(f._id)}">פתיחה</button>
        <button class="btn ghost sm" data-ren="${esc(f._id)}">שינוי שם</button>
        <button class="btn ghost sm" data-asg="${esc(f._id)}">שיוך מורה</button>
        <button class="btn dngr sm" data-delf="${esc(f._id)}">מחיקה</button></div>`;
    }).join('');
  };

  app.innerHTML = header('ניהול מערכת') + modeBanner() + `
    <div class="tabs">
      <button data-tab="teachers" class="${tab==='teachers'?'on':''}">מורים</button>
      <button data-tab="folders" class="${tab==='folders'?'on':''}">תיקיות</button>
      <button data-tab="committees">ועדות</button>
      <button data-tab="gvanim">גוונים</button>
      <button data-tab="settings" class="${tab==='settings'?'on':''}">הגדרות</button>
    </div>
    ${tab==='teachers'?`
      <div class="card"><h2>מורים במערכת</h2>${teachersHtml()}</div>
      <div class="card"><h2>הוספת מורה + תיקייה</h2>
        <div class="grid">
          <div><label>שם המורה</label><input id="tn" placeholder="לדוגמה: רחל כהן"></div>
          <div><label>שם התיקייה</label><input id="tf" placeholder="לדוגמה: כיתה ג'2"></div>
          <div><label>שם משתמש</label><input id="tu" placeholder="באנגלית, ללא רווחים"></div>
          <div><label>סיסמה ראשונית</label><input id="tp" type="text" placeholder="4 תווים לפחות"></div>
        </div>
        <div class="row mt"><button class="btn" id="addT">הוספה</button></div><div id="msg"></div></div>`
    : tab==='folders'?`
      <div class="card"><h2>תיקיות</h2>${foldersHtml()}</div>
      <div class="card"><h2>פתיחת תיקייה חדשה</h2>
        <div class="grid"><div><label>שם התיקייה</label><input id="nf" placeholder="לדוגמה: שכבת ד'"></div>
        <div><label>שיוך למורה (לא חובה)</label><select id="nfu"><option value="">— ללא —</option>
          ${users.filter(u=>u.role!=='admin').map(u=>`<option value="${esc(u.username)}">${esc(u.name||u.username)}</option>`).join('')}</select></div></div>
        <div class="row mt"><button class="btn" id="addF">יצירת תיקייה</button></div><div id="msg"></div></div>`
    :`
      <div class="card"><h2>הגדרות כלליות</h2>
        <div><label>שם המוסד</label><input id="org" value="${esc(cfg.org||'')}"></div>
        <div class="row mt"><button class="btn" id="saveOrg">שמירה</button></div>
        <h3>שינוי סיסמת המנהל</h3>
        <div class="grid"><div><label>סיסמה חדשה</label><input id="ap" type="password"></div>
        <div><label>אימות</label><input id="ap2" type="password"></div></div>
        <div class="row mt"><button class="btn ghost" id="saveAp">עדכון סיסמה</button></div>
        <h3>נתוני המערכת</h3>
        <p class="note">${users.length} משתמשים · ${folders.length} תיקיות · ${events.length} אירועים · ${subs.length} אישורים שהוגשו.
        אחסון: ${Store.mode==='cloud'?'Firebase Firestore (משותף)':'מקומי בדפדפן בלבד'}.</p>
        <div class="row mt"><button class="btn dngr" id="wipe">איפוס כל האישורים במערכת</button></div>
        <div id="msg"></div></div>`}`;
  bindOut();
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>adminPage(b.dataset.tab));

  if(tab==='teachers'){
    $('#addT').onclick = async () => {
      const n=norm($('#tn').value), fn=norm($('#tf').value), u=norm($('#tu').value), p=$('#tp').value;
      if(!n||!fn||!u||p.length<4) return $('#msg').innerHTML='<div class="err">נא למלא את כל השדות (סיסמה: 4 תווים לפחות).</div>';
      if(!/^[A-Za-z0-9_.\-]+$/.test(u)) return $('#msg').innerHTML='<div class="err">שם המשתמש יכול להכיל אותיות באנגלית, ספרות, נקודה ומקף בלבד.</div>';
      if(await Store.get('users/'+u)) return $('#msg').innerHTML='<div class="err">שם המשתמש כבר קיים.</div>';
      const fid = rid('f_');
      await Store.set('folders/'+fid, {name:fn, owner:u, createdAt:nowISO()});
      await Store.set('users/'+u, {username:u, name:n, role:'teacher', folderId:fid, hash:await sha(u,p), active:true, createdAt:nowISO()});
      adminPage('teachers');
    };
    app.querySelectorAll('[data-pw]').forEach(b=>b.onclick=async()=>{
      const u=b.dataset.pw, p=prompt('סיסמה חדשה עבור '+u+':'); if(!p||p.length<4) return;
      const rec=await Store.get('users/'+u); rec.hash=await sha(u,p); await Store.set('users/'+u,rec); alert('הסיסמה עודכנה.');
    });
    app.querySelectorAll('[data-gv]').forEach(b=>b.onclick=async()=>{
      const u=b.dataset.gv, rec=await Store.get('users/'+u); rec.gvanimAdmin = !rec.gvanimAdmin;
      await Store.set('users/'+u,rec); adminPage('teachers');
    });
    app.querySelectorAll('[data-tg]').forEach(b=>b.onclick=async()=>{
      const u=b.dataset.tg, rec=await Store.get('users/'+u); rec.active = rec.active===false; await Store.set('users/'+u,rec); adminPage('teachers');
    });
    app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      const u=b.dataset.del; if(!confirm('למחוק את המורה '+u+'? התיקייה והאישורים יישמרו.')) return;
      await Store.del('users/'+u); adminPage('teachers');
    });
  }
  if(tab==='folders'){
    $('#addF').onclick = async () => {
      const n=norm($('#nf').value); if(!n) return $('#msg').innerHTML='<div class="err">נא להזין שם תיקייה.</div>';
      const fid=rid('f_'); const u=$('#nfu').value;
      await Store.set('folders/'+fid,{name:n, owner:u||null, createdAt:nowISO()});
      if(u){ const rec=await Store.get('users/'+u); if(rec){ rec.folderId=fid; await Store.set('users/'+u,rec);} }
      adminPage('folders');
    };
    app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>teacherPage(b.dataset.open,true));
    app.querySelectorAll('[data-ren]').forEach(b=>b.onclick=async()=>{
      const id=b.dataset.ren, f=await Store.get('folders/'+id); const n=prompt('שם חדש לתיקייה:', f.name); if(!n) return;
      f.name=norm(n); await Store.set('folders/'+id,f); adminPage('folders');
    });
    app.querySelectorAll('[data-asg]').forEach(b=>b.onclick=async()=>{
      const id=b.dataset.asg;
      const opts = users.filter(u=>u.role!=='admin');
      const pick = prompt('שם המשתמש של המורה לשיוך (ריק = ביטול שיוך):\n'+opts.map(u=>u.username+' — '+(u.name||'')).join('\n'));
      if(pick===null) return;
      for(const u of opts){ if(u.folderId===id && u.username!==norm(pick)){ const r=await Store.get('users/'+u.username); r.folderId=null; await Store.set('users/'+u.username,r);} }
      if(norm(pick)){ const r=await Store.get('users/'+norm(pick)); if(!r) return alert('משתמש לא נמצא'); r.folderId=id; await Store.set('users/'+norm(pick),r); }
      const f=await Store.get('folders/'+id); f.owner=norm(pick)||null; await Store.set('folders/'+id,f);
      adminPage('folders');
    });
    app.querySelectorAll('[data-delf]').forEach(b=>b.onclick=async()=>{
      const id=b.dataset.delf; if(!confirm('למחוק את התיקייה על כל האירועים והאישורים שבה?')) return;
      for(const e of events.filter(e=>e.folderId===id)) await Store.del('events/'+e._id);
      for(const s of subs.filter(s=>s.folderId===id)) await Store.del('submissions/'+s._id);
      for(const u of users.filter(u=>u.folderId===id)){ const r=await Store.get('users/'+u.username); if(r){ r.folderId=null; await Store.set('users/'+u.username,r);} }
      await Store.del('folders/'+id); adminPage('folders');
    });
  }
  if(tab==='settings'){
    $('#saveOrg').onclick = async () => { const c=await Store.get('app/config')||{}; c.org=norm($('#org').value); c.bootstrapped=true; await Store.set('app/config',c); $('#msg').innerHTML='<div class="ok">נשמר ✓</div>'; };
    $('#saveAp').onclick = async () => {
      const p=$('#ap').value; if(p.length<4||p!==$('#ap2').value) return $('#msg').innerHTML='<div class="err">סיסמאות לא תקינות או לא תואמות.</div>';
      const r=await Store.get('users/'+ME.username); r.hash=await sha(ME.username,p); await Store.set('users/'+ME.username,r);
      $('#msg').innerHTML='<div class="ok">הסיסמה עודכנה ✓</div>';
    };
    $('#wipe').onclick = async () => {
      if(!confirm('למחוק את כל האישורים שהוגשו בכל התיקיות? האירועים יישארו.')) return;
      for(const s of subs) await Store.del('submissions/'+s._id);
      adminPage('settings');
    };
  }
}

/* ============ teacher folder ============ */
async function teacherPage(folderId, asAdmin){
  if(!folderId){
    app.innerHTML = header('תיקיית המורה') + `<div class="card"><div class="empty">לא שויכה לך תיקייה. פנו למנהל המערכת.</div></div>`;
    return bindOut();
  }
  app.innerHTML = header('טוען…') + `<div class="card"><div class="empty">טוען…</div></div>`; bindOut();
  const folder = await Store.get('folders/'+folderId);
  const events = (await Store.list('events','folderId',folderId)).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  const subs = await Store.list('submissions','folderId',folderId);
  const back = asAdmin ? `<button class="btn ghost sm" id="back">חזרה לניהול</button>` : '';

  const froster = (folder && folder.roster) || [];

  app.innerHTML = header('תיקייה: '+((folder&&folder.name)||'—'), back) + modeBanner() + folderTabs('slips') + `
    <div class="card">
      <h2>רשימת התלמידים בכיתה</h2>
      <p class="sub">מקלידים פעם אחת — ומכאן והלאה הרשימה נטענת אוטומטית לכל אירוע חדש.</p>
      <label>שורה לכל תלמיד/ה</label>
      <textarea id="froster" style="min-height:150px" placeholder="יעל לוי&#10;דניאל כהן&#10;נועה ברק">${esc(froster.join('\n'))}</textarea>
      <div class="row mt"><button class="btn" id="saveRoster">שמירת הרשימה</button>
        <span class="note" id="rcount">${froster.length} תלמידים ברשימה</span></div>
      <div id="rmsg"></div>
    </div>
    <div class="card">
      <h2>אירועים בתיקייה</h2>
      ${events.length? events.map(e=>{
        const n = subs.filter(s=>s.eventId===e._id).length;
        const total = (e.roster||[]).length;
        return `<div class="listrow"><div class="main"><b>${esc(e.atype)}${e.place?' · '+esc(e.place):''}</b>
          <div class="meta">${esc(dayName(e.adate))} ${esc(heDate(e.adate))}${e.t1?' · '+esc(e.t1)+'–'+esc(e.t2):''} · הוגשו ${n}${total?' מתוך '+total:''}</div></div>
          <span class="tag ${e.closed?'no':'ok'}">${e.closed?'סגור':'פתוח'}</span>
          <button class="btn ghost sm" data-ev="${esc(e._id)}">פתיחה</button></div>`;
      }).join('') : `<div class="empty">אין עדיין אירועים. צרו אירוע חדש למטה.</div>`}
    </div>
    <div class="card"><h2>אירוע חדש</h2>${eventForm(froster)}
      <div class="row mt"><button class="btn" id="create">יצירת האירוע וקבלת קישור</button></div><div id="msg"></div></div>`;
  bindOut(); bindFolderTabs(folderId, asAdmin);
  if(asAdmin) $('#back').onclick = () => adminPage('folders');

  $('#saveRoster').onclick = async () => {
    const list = $('#froster').value.split('\n').map(norm).filter(Boolean);
    const f = Object.assign({}, folder||{}); delete f._id; f.roster = list;
    await Store.set('folders/'+folderId, f);
    folder.roster = list;
    $('#rcount').textContent = list.length+' תלמידים ברשימה';
    $('#rmsg').innerHTML = '<div class="ok">הרשימה נשמרה ✓ היא תיטען אוטומטית לכל אירוע חדש.</div>';
    const er = $('#roster'); if(er && !er.value.trim()) er.value = list.join('\n');
  };
  const useBtn = $('#useRoster');
  if(useBtn) useBtn.onclick = () => { $('#roster').value = ($('#froster').value.split('\n').map(norm).filter(Boolean)).join('\n'); };
  app.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>eventPage(b.dataset.ev, folderId, asAdmin));

  $('#create').onclick = async () => {
    const g = id => norm($('#'+id).value);
    if(!g('adate')) return $('#msg').innerHTML='<div class="err">נא לבחור תאריך לפעילות.</div>';
    const ev = {folderId, s1:g('s1'), s2:g('s2'), ldate:g('ldate'), adate:g('adate'), atype:g('atype'),
      place:g('place'), t1:g('t1'), t2:g('t2'), body:$('#body').value.trim(), from:g('from'), extra:g('extra'),
      roster:$('#roster').value.split('\n').map(norm).filter(Boolean), closed:false, createdAt:nowISO(), createdBy:ME.username};
    const id = rid('e_');
    await Store.set('events/'+id, ev);
    eventPage(id, folderId, asAdmin);
  };
}

/* ============ event page (teacher tracking) ============ */
async function eventPage(eid, folderId, asAdmin){
  app.innerHTML = header('טוען אירוע…') + `<div class="card"><div class="empty">טוען…</div></div>`; bindOut();
  const ev = await Store.get('events/'+eid);
  if(!ev) return teacherPage(folderId, asAdmin);
  ev._id = eid;
  const subs = (await Store.list('submissions','eventId',eid)).sort((a,b)=>(a.submittedAt||'').localeCompare(b.submittedAt||''));
  const link = location.origin + location.pathname + location.search + '#e=' + eid;
  const roster = ev.roster||[];
  const byName = {}; subs.forEach(s=>{ byName[norm(s.child)] = s; });
  const extras = subs.filter(s=>!roster.some(r=>norm(r)===norm(s.child)));

  const rosterRows = roster.map(r=>{ const s=byName[norm(r)];
    return `<tr><td>${esc(r)}</td>
      <td>${s?'<span class="tag ok">הוגש</span>':'<span class="tag no">טרם הוגש</span>'}</td>
      <td class="note">${s?esc(fmtTime(s.submittedAt)):''}</td>
      <td class="note">${s?esc(s.pname||''):''}</td>
      <td>${s?`<button class="btn ghost sm" data-pdf="${esc(s._id)}">PDF</button> <button class="btn dngr sm" data-rm="${esc(s._id)}">מחיקה</button>`:''}</td></tr>`;
  }).join('');
  const extraRows = extras.map(s=>`<tr><td>${esc(s.child)} <span class="note">(לא ברשימה)</span></td>
      <td><span class="tag ok">הוגש</span></td><td class="note">${esc(fmtTime(s.submittedAt))}</td><td class="note">${esc(s.pname||'')}</td>
      <td><button class="btn ghost sm" data-pdf="${esc(s._id)}">PDF</button> <button class="btn dngr sm" data-rm="${esc(s._id)}">מחיקה</button></td></tr>`).join('');

  app.innerHTML = header('אירוע · '+ev.atype, `<button class="btn ghost sm" id="back">חזרה לתיקייה</button>`) + modeBanner() + `
    <div class="card">
      <h2>${esc(ev.atype)}${ev.place?' · '+esc(ev.place):''}</h2>
      <p class="sub">${esc(dayName(ev.adate))} ${esc(heDate(ev.adate))}${ev.t1?' · '+esc(ev.t1)+'–'+esc(ev.t2):''} · נוצר ${esc(fmtTime(ev.createdAt))}</p>
      <div class="linkbox">
        <strong>קישור למילוי ההורים</strong>
        <code id="lnk">${esc(link)}</code>
        <div class="row"><button class="btn sm" id="copy">העתקת הקישור</button>
          <button class="btn ghost sm" id="open">תצוגה מקדימה</button>
          <button class="btn ghost sm" id="toggle">${ev.closed?'פתיחת האירוע למילוי':'סגירת האירוע למילוי'}</button></div>
      </div>
    </div>
    <div class="card">
      <h2>מעקב הגשות · ${subs.length}${roster.length?' מתוך '+roster.length:''}</h2>
      ${(roster.length||subs.length)?`<div class="scroll"><table>
        <tr><th>תלמיד/ה</th><th>סטטוס</th><th>זמן הגשה</th><th>הורה חותם</th><th></th></tr>
        ${rosterRows}${extraRows}</table></div>`:`<div class="empty">אף הורה טרם מילא.</div>`}
      <div class="row mt">
        <button class="btn ghost" id="sync">עדכון מרשימת הכיתה</button>
        <button class="btn ghost" id="all" ${subs.length?'':'disabled'}>הורדת כל האישורים (PDF)</button>
        <button class="btn dngr" id="reset" ${subs.length?'':'disabled'}>איפוס האישורים באירוע</button>
        <button class="btn dngr" id="delev">מחיקת האירוע</button>
      </div>
      <div id="msg"></div>
    </div>`;
  bindOut();
  $('#back').onclick = () => teacherPage(folderId, asAdmin);
  $('#copy').onclick = async () => { try{ await navigator.clipboard.writeText(link); $('#copy').textContent='הועתק ✓'; }catch(e){ $('#copy').textContent='סמנו והעתיקו ידנית'; } };
  $('#open').onclick = () => parentPage(eid, () => eventPage(eid, folderId, asAdmin));
  $('#toggle').onclick = async () => { ev.closed=!ev.closed; const c=Object.assign({},ev); delete c._id; await Store.set('events/'+eid,c); eventPage(eid, folderId, asAdmin); };
  app.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=async()=>{
    const s = subs.find(x=>x._id===b.dataset.pdf); b.textContent='…';
    try{ await downloadSlip(ev,s); }catch(e){} b.textContent='PDF';
  });
  app.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{
    if(!confirm('למחוק את האישור הזה?')) return;
    await Store.del('submissions/'+b.dataset.rm); eventPage(eid, folderId, asAdmin);
  });
  $('#sync').onclick = async () => {
    const f = await Store.get('folders/'+folderId);
    const list = (f && f.roster) || [];
    if(!list.length) return $('#msg').innerHTML='<div class="err">לא הוגדרה רשימת כיתה בתיקייה.</div>';
    if(!confirm('לעדכן את רשימת התלמידים באירוע לפי רשימת הכיתה ('+list.length+' תלמידים)? האישורים שכבר הוגשו יישמרו.')) return;
    const c = Object.assign({}, ev); delete c._id; c.roster = list;
    await Store.set('events/'+eid, c); eventPage(eid, folderId, asAdmin);
  };
  $('#all').onclick = async () => {
    $('#msg').innerHTML='<div class="note">מייצר קבצים…</div>';
    for(const s of subs){ try{ await downloadSlip(ev,s); }catch(e){} }
    $('#msg').innerHTML='<div class="ok">הורדו '+subs.length+' אישורים ✓</div>';
  };
  $('#reset').onclick = async () => {
    if(!confirm('לאפס את כל האישורים שהוגשו באירוע זה? הפעולה אינה הפיכה.')) return;
    for(const s of subs) await Store.del('submissions/'+s._id);
    eventPage(eid, folderId, asAdmin);
  };
  $('#delev').onclick = async () => {
    if(!confirm('למחוק את האירוע ואת כל האישורים שבו?')) return;
    for(const s of subs) await Store.del('submissions/'+s._id);
    await Store.del('events/'+eid); teacherPage(folderId, asAdmin);
  };
}

/* ============ parent page ============ */
async function parentPage(eid, onBack){
  app.innerHTML = `<div class="card"><div class="empty">טוען את הטופס…</div></div>`;
  const ev = await Store.get('events/'+eid);
  if(!ev){ app.innerHTML = `<div class="card"><h2>הקישור אינו תקין</h2><p class="sub">ייתכן שהאירוע נמחק. פנו למורה לקבלת קישור מעודכן.</p></div>`; return; }
  ev._id = eid;
  if(ev.closed){
    app.innerHTML = `<div class="card"><h2>הטופס נסגר למילוי</h2><p class="sub">${esc(ev.atype)} · ${esc(heDate(ev.adate))}. פנו למורה.</p></div>`;
    return;
  }
  const hours = (ev.t1&&ev.t2)?`יציאה בשעה ${ev.t1}, חזרה משוערת בשעה ${ev.t2}.`:'';
  app.innerHTML = `
    <div class="topbar"><div class="brand">${esc(ev.s1)}<small>${esc(ev.s2)}</small></div>
      ${onBack?'<button class="btn ghost sm" id="back">חזרה</button>':''}</div>
    <div class="card">
      <h2>אישור הורים · ${esc(ev.atype)}</h2>
      <div style="line-height:1.95">
        <p style="margin:0 0 6px">הורים יקרים,</p>
        <p style="margin:0 0 6px">${esc(letterBody(ev))}</p>
        ${hours?`<p style="margin:0 0 6px">${esc(hours)}</p>`:''}
        ${ev.extra?`<p style="margin:0 0 6px">${esc(ev.extra)}</p>`:''}
        <p style="margin:12px 0 0">${esc(ev.from)}</p>
      </div>
    </div>
    <div class="card">
      <h2>מילוי ואישור</h2>
      <div class="grid">
        <div><label>שם התלמיד/ה</label><input id="child" placeholder="שם מלא"></div>
        <div><label>כיתה</label><input id="cls" placeholder="לדוגמה: ג'2"></div>
        <div><label>שם ההורה</label><input id="pname" placeholder="שם מלא"></div>
        <div><label>טלפון ליצירת קשר</label><input id="phone" inputmode="tel" placeholder="050-0000000"></div>
        <div class="full"><label>הערות / רגישויות בריאותיות (לא חובה)</label><input id="notes"></div>
      </div>
      <h3>חתימת ההורה</h3>
      <div class="sigwrap"><canvas id="sig"></canvas><div class="sighint" id="sighint">חתמו כאן באצבע או בעכבר</div></div>
      <div class="row" style="margin-top:9px"><button class="btn ghost sm" id="clr">ניקוי החתימה</button></div>
      <div style="margin-top:16px" class="chk"><input type="checkbox" id="agree">
        <label for="agree" style="margin:0; color:var(--ink)">הנני מאשר/ת לבני / בתי לצאת ל${esc(ev.atype)}${ev.place?' ב'+esc(ev.place):''} ביום ${esc(dayName(ev.adate))} ${esc(heDate(ev.adate))}.</label></div>
      <div class="row mt"><button class="btn" id="submit">יצירת האישור והגשה למורה</button></div>
      <div id="msg"></div>
    </div>`;
  if(onBack) $('#back').onclick = onBack;
  setupSig(); $('#clr').onclick = clearSig;
  $('#submit').onclick = async () => {
    const sub = {eventId:eid, folderId:ev.folderId,
      child:norm($('#child').value), cls:norm($('#cls').value), pname:norm($('#pname').value),
      phone:norm($('#phone').value), notes:norm($('#notes').value), submittedAt:nowISO()};
    const msg = $('#msg');
    if(!sub.child || !sub.pname) return msg.innerHTML='<div class="err">נא למלא את שם התלמיד/ה ואת שם ההורה.</div>';
    if(!shas) return msg.innerHTML='<div class="err">נא לחתום במסגרת החתימה.</div>';
    if(!$('#agree').checked) return msg.innerHTML='<div class="err">נא לסמן את תיבת האישור.</div>';
    msg.innerHTML='<div class="note">מגיש…</div>';
    sub.sig = sigData();
    const sid = rid('s_'); sub._id = sid;
    try{
      const body = Object.assign({}, sub); delete body._id;
      await Store.set('submissions/'+sid, body);
    }catch(e){
      return msg.innerHTML='<div class="err">ההגשה נכשלה. נסו שוב, או פנו למורה.</div>';
    }
    msg.innerHTML = `<div class="ok"><b>האישור הוגש למורה ✓</b><br>
      התקבל בתיקיית הכיתה בשם ${esc(sub.child)}. אפשר גם לשמור עותק אישי.
      <div class="row" style="margin-top:10px"><button class="btn ghost sm" id="mine">שמירת עותק PDF</button></div></div>`;
    $('#submit').disabled = true;
    $('#mine').onclick = async () => { $('#mine').textContent='…'; try{ await downloadSlip(ev, sub); }catch(e){} $('#mine').textContent='שמירת עותק PDF'; };
  };
}

const cColor = c => (c && c.color) || C_PALETTE[((c&&c.n)||0) % C_PALETTE.length];
function cChip(c, small){
  if(!c) return '<span class="note">—</span>';

      <div class="hero-school">${esc(cfg.org||'בית הספר הממלכתי הנרייטה סאלד ירושלים')}</div>
      <h1 class="hero-title">ועדות תלמידים <span>${C_YEAR}</span></h1>

    </div>

      ${roster.length? (missing().length? `<p class="sub" style="margin-bottom:6px">טרם מילאו:</p><div class="miss">${missing().map(m=>`<span>${esc(m)}</span>`).join('')}</div>` : '<div class="ok" style="margin-top:0">כל תלמידי הכיתה מילאו ✓</div>')
        : '<p class="note">כדי לראות מי עוד לא מילא — הגדירו רשימת תלמידים בלשונית "אישורי הורים".</p>'}
    </div>
    <div class="card">
      <h2>שיבוץ לוועדות</h2>
      <div class="row" style="align-items:flex-end; margin-bottom:12px">

        <button class="btn" id="auto" ${picks.length?'':'disabled'}>שיבוץ אוטומטי לפי העדיפויות</button>
        <button class="btn ghost" id="clear" ${picks.length?'':'disabled'}>ניקוי כל השיבוצים</button>
      </div>
      <p class="note" style="margin:0 0 12px">השיבוץ האוטומטי ממלא קודם את עדיפות 1 של כולם; אם ועדה מלאה — עובר לעדיפות 2 ואחר כך 3. שיבוצים שכבר נקבעו נשמרים. אפשר לשנות כל שיבוץ ידנית מהרשימה.</p>
      ${picks.length?`<div class="scroll"><table class="ptable"><tr><th>תלמיד/ה</th><th>עדיפות 1</th><th>עדיפות 2</th><th>עדיפות 3</th><th>שיבוץ</th><th></th></tr>
        ${picks.map(rowHtml).join('')}</table></div>`:'<div class="empty">עדיין לא התקבלו בחירות. שלחו את הקישור לתלמידים.</div>'}

    <div class="card">
      <h2>הפקת פלט</h2>
      <p class="sub">דף מסודר של שיבוץ הכיתה לוועדות — להדפסה, לשליחה למורים המלווים או לתיוק.</p>
      <div class="row"><button class="btn" id="pdf" ${picks.length?'':'disabled'}>הורדת PDF</button>
        <button class="btn ghost" id="csv" ${picks.length?'':'disabled'}>הורדת קובץ Excel (CSV)</button></div>
      <div id="emsg"></div>
    </div>`;

  const refreshSum = () => { $('#sum').innerHTML = summaryHtml(); };

    for(const key of ['p1','p2','p3']){

    await saveFile(`ועדות_${(folder.name||'כיתה').replace(/\s+/g,'_')}.csv`, csvBlob(rows));

  };

    $('#emsg').innerHTML='<div class="note">מייצר PDF…</div>';

    catch(e){ $('#emsg').innerHTML='<div class="err">יצירת הקובץ נכשלה. נסו שוב.</div>'; }
  };
}

function csvBlob(rows){
  const q = v => { v = String(v==null?'':v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  return new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n')], {type:'text/csv;charset=utf-8'});
}

async function committeesPdf(folder, list, picks){
  const cfg = await Store.get('app/config') || {};
  const el = document.getElementById('cprint');
  const groups = list.map(c=>({c, kids:picks.filter(p=>String(p.assigned)===String(c.n))})).filter(g=>g.kids.length);
  const un = picks.filter(p=>p.assigned==null);
  const rk = p => p.assigned==null?'—':String(p.assigned)===String(p.p1)?'1':String(p.assigned)===String(p.p2)?'2':String(p.assigned)===String(p.p3)?'3':'ידני';
  el.innerHTML = `
    <div class="ph"><div><div class="po">${esc(cfg.org||'')}</div><h1>שיבוץ לוועדות תלמידים ${C_YEAR}</h1>
      <div class="pm">כיתה: <b>${esc(folder.name||'')}</b> · ${picks.length} תלמידים · הופק ${esc(new Date().toLocaleDateString('he-IL'))}</div></div></div>
    <div class="pg">${groups.map(g=>`<div class="pb" style="border-color:${cColor(g.c)}">
      <div class="pbh" style="background:${cColor(g.c)}">${esc(g.c.name)} <span>(${g.kids.length})</span></div>
      <div class="pbt">מורה מלווה: ${esc(g.c.teacher||'')}</div>
      <ol>${g.kids.map(k=>`<li>${esc(k.child)}</li>`).join('')}</ol></div>`).join('')}</div>
    ${un.length?`<div class="pun">ללא שיבוץ: ${un.map(p=>esc(p.child)).join(' · ')}</div>`:''}
    <h2>פירוט הבחירות</h2>
    <table><tr><th>#</th><th>תלמיד/ה</th><th>עדיפות 1</th><th>עדיפות 2</th><th>עדיפות 3</th><th>שובץ/ה ל</th><th>עדיפות</th></tr>
      ${picks.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.child)}</td><td>${esc((cFind(list,p.p1)||{}).name||'—')}</td><td>${esc((cFind(list,p.p2)||{}).name||'—')}</td><td>${esc((cFind(list,p.p3)||{}).name||'—')}</td><td><b>${esc((cFind(list,p.assigned)||{}).name||'—')}</b></td><td>${rk(p)}</td></tr>`).join('')}</table>`;
  await new Promise(r=>setTimeout(r,80));
  const canvas = await html2canvas(el, {scale:2, backgroundColor:'#ffffff'});
  const {jsPDF} = window.jspdf; const pdf = new jsPDF('p','mm','a4');
  const pxPerPage = Math.floor(canvas.width * 297/210);
  for(let y=0, first=true; y<canvas.height; y+=pxPerPage, first=false){
    const h = Math.min(pxPerPage, canvas.height-y);
    const part = document.createElement('canvas'); part.width = canvas.width; part.height = h;
    const ctx = part.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,part.width,h); ctx.drawImage(canvas, 0, -y);
    if(!first) pdf.addPage();
    pdf.addImage(part.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,h*210/canvas.width);
  }
  return pdf.output('blob');
}

    picks.filter(p=>p.assigned==null).forEach(p=>rows.push(['— לא שובץ —','',p.child,p.cls||fname(p.folderId),'']));
    await saveFile('שיבוץ_ועדות_בית_הספר.csv', csvBlob(rows));
  };
}

    app.querySelector('.hero').after(done);
  };
}

    </div>
    <div class="card">
      <h2>מי מילא · ${picks.length}${roster.length?' מתוך '+roster.length:''}</h2>
      ${roster.length? (missing().length? `<p class="sub" style="margin-bottom:6px">טרם מילאו:</p><div class="miss">${missing().map(m=>`<span>${esc(m)}</span>`).join('')}</div>` : '<div class="ok" style="margin-top:0">כל תלמידי הכיתה מילאו ✓</div>')
        : '<p class="note">כדי לראות מי עוד לא מילא — הגדירו רשימת תלמידים בלשונית "אישורי הורים".</p>'}
    </div>
    <div class="card">
      <h2>שיבוץ לחוגים</h2>
      <div class="row" style="align-items:flex-end; margin-bottom:12px">
        <div style="width:230px"><label>מקסימום תלמידים מהכיתה בכל חוג</label><input id="cap" type="number" min="1" placeholder="ללא הגבלה" value="${esc(gform.cap||'')}"></div>
        <button class="btn" id="auto" ${picks.length?'':'disabled'}>שיבוץ אוטומטי לפי העדיפויות</button>
        <button class="btn ghost" id="clear" ${picks.length?'':'disabled'}>ניקוי כל השיבוצים</button>
      </div>
      <p class="note" style="margin:0 0 12px">השיבוץ האוטומטי ממלא קודם את עדיפות 1 של כולם; אם חוג מלא — עובר לעדיפות 2 ואחר כך 3. שיבוצים שכבר נקבעו נשמרים.</p>
      ${picks.length?`<div class="scroll"><table class="ptable"><tr><th>תלמיד/ה</th><th>עדיפות 1</th><th>עדיפות 2</th><th>עדיפות 3</th><th>שיבוץ</th><th></th></tr>
        ${picks.map(rowHtml).join('')}</table></div>`:'<div class="empty">עדיין לא התקבלו בחירות. שלחו את הקישור לתלמידים.</div>'}
      <div id="amsg"></div>
      <h3>הוספה ידנית (לתלמיד/ה שלא מילא/ה)</h3>
      <div class="row"><input id="mname" placeholder="שם התלמיד/ה" style="flex:1; min-width:160px" list="gmrl">
        <datalist id="gmrl">${missing().map(r=>`<option value="${esc(r)}">`).join('')}</datalist>
        <select id="mcom" style="flex:1; min-width:160px">${options('')}</select>
        <button class="btn ghost" id="madd">הוספה</button></div>
    </div>
    <div class="card"><h2>סיכום לפי חוגים</h2><div id="sum">${summaryHtml()}</div></div>
    <div class="card">
      <h2>הפקת פלט</h2>
      <p class="sub">דף מסודר של שיבוץ הכיתה לחוגים — להדפסה, לשליחה למדריכים או לתיוק.</p>
      <div class="row"><button class="btn" id="pdf" ${picks.length?'':'disabled'}>הורדת PDF</button>
        <button class="btn ghost" id="csv" ${picks.length?'':'disabled'}>הורדת קובץ Excel (CSV)</button></div>
      <div id="emsg"></div>
    </div>`;
  bindOut(); bindFolderTabs(folderId, asAdmin);
  if(asAdmin) $('#back').onclick = () => adminPage('folders');
  const refreshSum = () => { $('#sum').innerHTML = summaryHtml(); };
  const reload = () => gvanimTeacher(folderId, asAdmin);

  $('#copy').onclick = async () => { try{ await navigator.clipboard.writeText(link); $('#copy').textContent='הועתק ✓'; }catch(e){ $('#copy').textContent='סמנו והעתיקו ידנית'; } };
  $('#prev').onclick = () => gvanimStudent(folderId, reload);
  $('#tog').onclick = async () => { await saveFolder({closed:!gform.closed}); reload(); };
  app.querySelectorAll('[data-as]').forEach(s=>s.onchange=async()=>{
    const p = picks.find(x=>x._id===s.dataset.as); p.assigned = s.value===''?null:(isNaN(+s.value)?s.value:+s.value);
    await savePick(p); s.parentElement.querySelector('.rk').innerHTML = rankTag(p); refreshSum();
  });
  app.querySelectorAll('[data-delp]').forEach(b=>b.onclick=async()=>{
    const p = picks.find(x=>x._id===b.dataset.delp); if(!confirm('למחוק את הבחירה של '+p.child+'?')) return;
    await Store.del('gpicks/'+p._id); reload();
  });
  $('#auto').onclick = async () => {
    const capRaw = parseInt($('#cap').value,10); const capG = capRaw>0 ? capRaw : Infinity;
    await saveFolder({cap: capRaw>0?capRaw:''});
    const cnt = {}; picks.forEach(p=>{ if(p.assigned!=null) cnt[p.assigned]=(cnt[p.assigned]||0)+1; });
    const limit = c => { const club = cFind(list, c); const own = club && club.cap>0 ? club.cap : Infinity; return Math.min(own, capG); };
    const queue = picks.filter(p=>p.assigned==null).sort((a,b)=>(a.submittedAt||'').localeCompare(b.submittedAt||''));
    const changed = [];
    for(const key of ['p1','p2','p3']){
      for(const p of queue){
        if(p.assigned!=null || p[key]==null) continue;
        if((cnt[p[key]]||0) < limit(p[key])){ p.assigned = p[key]; cnt[p[key]]=(cnt[p[key]]||0)+1; changed.push(p); }
      }
    }
    for(const p of changed) await savePick(p);
    reload();
  };
  $('#clear').onclick = async () => {
    if(!confirm('לנקות את כל השיבוצים בכיתה? הבחירות של התלמידים יישמרו.')) return;
    for(const p of picks){ if(p.assigned!=null){ p.assigned=null; await savePick(p);} } reload();
  };
  $('#madd').onclick = async () => {
    const n = norm($('#mname').value), v = $('#mcom').value;
    if(!n) return $('#amsg').innerHTML='<div class="err">נא להזין שם.</div>';
    if(picks.some(p=>norm(p.child)===n)) return $('#amsg').innerHTML='<div class="err">התלמיד/ה כבר ברשימה — אפשר לשנות את השיבוץ בטבלה.</div>';
    const a = v===''?null:(isNaN(+v)?v:+v);
    await Store.set('gpicks/'+rid('g_'), {folderId, child:n, cls:folder.name||'', p1:null, p2:null, p3:null, assigned:a, manual:true, submittedAt:nowISO()});
    reload();
  };
  $('#csv').onclick = async () => {
    const rows = [['שם התלמיד/ה','כיתה','עדיפות 1','עדיפות 2','עדיפות 3','שובץ/ה לחוג','עדיפות שהתקבלה']];
    picks.forEach(p=>{ const a=cFind(list,p.assigned), r=gotRank(p);
      rows.push([p.child, p.cls||folder.name||'', (cFind(list,p.p1)||{}).name||'', (cFind(list,p.p2)||{}).name||'', (cFind(list,p.p3)||{}).name||'', a?a.name:'', r===0?'לא שובץ':r===4?'ידני':String(r)]); });
    await saveFile(`גוונים_${(folder.name||'כיתה').replace(/\s+/g,'_')}.csv`, csvBlob(rows));
    $('#emsg').innerHTML='<div class="ok">הקובץ הורד ✓</div>';
  };
  $('#pdf').onclick = async () => {
    $('#emsg').innerHTML='<div class="note">מייצר PDF…</div>';
    try{ await saveFile(`שיבוץ_גוונים_${(folder.name||'כיתה').replace(/\s+/g,'_')}.pdf`, await gvanimPdf(folder, list, picks)); $('#emsg').innerHTML='<div class="ok">הקובץ הורד ✓</div>'; }
    catch(e){ $('#emsg').innerHTML='<div class="err">יצירת הקובץ נכשלה. נסו שוב.</div>'; }
  };
}

async function gvanimPdf(folder, list, picks){
  const cfg = await Store.get('app/config') || {};
  const el = document.getElementById('cprint');
  const groups = list.map(c=>({c, kids:picks.filter(p=>String(p.assigned)===String(c.n))})).filter(g=>g.kids.length);
  const un = picks.filter(p=>p.assigned==null);
  const rk = p => p.assigned==null?'—':String(p.assigned)===String(p.p1)?'1':String(p.assigned)===String(p.p2)?'2':String(p.assigned)===String(p.p3)?'3':'ידני';
  el.innerHTML = `
    <div class="ph"><div><div class="po">${esc(cfg.org||'')}</div><h1>שיבוץ לחוגי גוונים ${C_YEAR}</h1>
      <div class="pm">${folder.name?'כיתה: <b>'+esc(folder.name)+'</b> · ':''}${picks.length} תלמידים · הופק ${esc(new Date().toLocaleDateString('he-IL'))}</div></div></div>
    <div class="pg">${groups.map(g=>`<div class="pb" style="border-color:${cColor(g.c)}">
      <div class="pbh" style="background:${cColor(g.c)}">${esc(g.c.icon||'')} ${esc(g.c.name)} <span>(${g.kids.length})</span></div>
      <ol>${g.kids.map(k=>`<li>${esc(k.child)}${k.cls&&!folder.name?' <span>('+esc(k.cls)+')</span>':''}</li>`).join('')}</ol></div>`).join('')}</div>
    ${un.length?`<div class="pun">ללא שיבוץ: ${un.map(p=>esc(p.child)).join(' · ')}</div>`:''}
    <h2>פירוט הבחירות</h2>
    <table><tr><th>#</th><th>תלמיד/ה</th><th>כיתה</th><th>עדיפות 1</th><th>עדיפות 2</th><th>עדיפות 3</th><th>שובץ/ה ל</th><th>עדיפות</th></tr>
      ${picks.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.child)}</td><td>${esc(p.cls||folder.name||'')}</td><td>${esc((cFind(list,p.p1)||{}).name||'—')}</td><td>${esc((cFind(list,p.p2)||{}).name||'—')}</td><td>${esc((cFind(list,p.p3)||{}).name||'—')}</td><td><b>${esc((cFind(list,p.assigned)||{}).name||'—')}</b></td><td>${rk(p)}</td></tr>`).join('')}</table>`;
  await new Promise(r=>setTimeout(r,80));
  const canvas = await html2canvas(el, {scale:2, backgroundColor:'#ffffff'});
  const {jsPDF} = window.jspdf; const pdf = new jsPDF('p','mm','a4');
  const pxPerPage = Math.floor(canvas.width * 297/210);
  for(let y=0, first=true; y<canvas.height; y+=pxPerPage, first=false){
    const h = Math.min(pxPerPage, canvas.height-y);
    const part = document.createElement('canvas'); part.width = canvas.width; part.height = h;
    const ctx = part.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,part.width,h); ctx.drawImage(canvas, 0, -y);
    if(!first) pdf.addPage();
    pdf.addImage(part.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,h*210/canvas.width);
  }
  return pdf.output('blob');
}

/* ---------------- admin: gvanim tab ---------------- */
async function adminGvanim(fromFolder){
  const isAdmin = ME && ME.role==='admin';
  app.innerHTML = header(isAdmin?'ניהול מערכת':'ניהול חוגי גוונים') + modeBanner() + `<div class="card"><div class="empty">טוען…</div></div>`; bindOut();
  const list = (await getClubs()).map(c=>Object.assign({}, c));
  const [folders, picks] = await Promise.all([Store.list('folders'), Store.list('gpicks')]);
  const fname = id => ((folders.find(f=>f._id===id)||{}).name)||'';
  const tabsBar = isAdmin ? `<div class="tabs">
      <button data-tab="teachers">מורים</button><button data-tab="folders">תיקיות</button>
      <button data-tab="committees">ועדות</button><button data-tab="gvanim" class="on">גוונים</button>
      <button data-tab="settings">הגדרות</button></div>` : folderTabs('gadmin');
  const overview = list.map(c=>{
    const kids = picks.filter(p=>String(p.assigned)===String(c.n));
    const demand = picks.filter(p=>String(p.p1)===String(c.n)).length;
    const over = c.cap>0 && kids.length>c.cap;
    return `<div class="sumbox${kids.length?'':' zero'}" style="--c:${cColor(c)}">
      <div class="sumh"><span>${esc(c.icon||'')} ${esc(c.name)}</span><b>${kids.length}${c.cap?' / '+esc(c.cap):''}</b></div>
      <div class="note">${demand} בחרו כעדיפות 1${over?' · חריגה מהמכסה':''}</div>
      <div class="sumn">${kids.map(k=>esc(k.child)+' <span class="note">('+esc(k.cls||fname(k.folderId))+')</span>').join(' · ')||'<span class="note">אין עדיין משובצים</span>'}</div></div>`;
  }).join('');
  const editRow = (c,i) => `<div class="cedit" style="--c:${cColor(c)}">
      <div class="grid3">
        <div><label>מס'</label><input data-f="n" data-i="${i}" value="${esc(c.n)}"></div>
        <div><label>שם החוג</label><input data-f="name" data-i="${i}" value="${esc(c.name)}"></div>
        <div><label>מספר מקומות</label><input data-f="cap" data-i="${i}" value="${esc(c.cap||'')}"></div>
        <div><label>אייקון (אימוג׳י)</label><input data-f="icon" data-i="${i}" value="${esc(c.icon||'')}"></div>
        <div class="full" style="grid-column:2/-1"><label>תיאור</label><textarea data-f="desc" data-i="${i}" style="min-height:58px">${esc(c.desc||'')}</textarea></div>
      </div>
      <div class="row" style="margin-top:8px"><button class="btn dngr sm" data-rmc="${i}">הסרת החוג</button></div></div>`;
  app.innerHTML = header('ניהול מערכת') + modeBanner() + tabsBar + `
    <div class="card">
      <h2>תמונת מצב בית־ספרית · ${picks.length} תלמידים בחרו</h2>
      <p class="sub">כמה תלמידים שובצו לכל חוג מכל הכיתות — נוח להעביר למדריכים.</p>
      <div class="sumgrid">${overview}</div>
      <div class="row mt">
        <button class="btn" id="allpdf" ${picks.length?'':'disabled'}>הורדת שיבוץ כל בית הספר (PDF)</button>
        <button class="btn ghost" id="allcsv" ${picks.length?'':'disabled'}>הורדת שיבוץ כל בית הספר (CSV)</button>
      </div><div id="emsg"></div>
    </div>
    <div class="card">
      <h2>רשימת החוגים</h2>
      <p class="sub">זו הרשימה שהתלמידים רואים בטופס. שינויים נשמרים לכל הכיתות.</p>
      <div id="clist">${list.map(editRow).join('')}</div>
      <div class="row mt"><button class="btn ghost" id="addc">הוספת חוג</button><button class="btn" id="savec">שמירת הרשימה</button></div>
      <div id="msg"></div>
    </div>
    <div class="card">
      <h2>שיבוץ לפי כיתות</h2>
      ${folders.length? folders.map(f=>{ const n = picks.filter(p=>p.folderId===f._id).length;
        return `<div class="listrow"><div class="main"><b>${esc(f.name)}</b>
          <div class="note">${n} בחירות · ${picks.filter(p=>p.folderId===f._id&&p.assigned!=null).length} שובצו</div></div>
          <button class="btn ghost sm" data-of="${esc(f._id)}">פתיחת התיקייה</button></div>`; }).join('')
      : '<div class="empty">אין עדיין תיקיות.</div>'}
    </div>`;
  bindOut();
  if(isAdmin) app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=> b.dataset.tab==='committees'?adminCommittees():b.dataset.tab==='gvanim'?adminGvanim():adminPage(b.dataset.tab));
  else bindFolderTabs(fromFolder || ME.folderId, false);
  app.querySelectorAll('[data-of]').forEach(b=>b.onclick=()=>gvanimTeacher(b.dataset.of, isAdmin));
  const collect = () => app.querySelectorAll('[data-f]').forEach(inp=>{ const c=list[+inp.dataset.i]; const v=inp.value.trim();
    c[inp.dataset.f] = (inp.dataset.f==='n'||inp.dataset.f==='cap') ? (isNaN(+v)||v===''?(inp.dataset.f==='cap'?'':v):+v) : v; });
  const redraw = () => { $('#clist').innerHTML = list.map(editRow).join(''); bindRm(); };
  const bindRm = () => app.querySelectorAll('[data-rmc]').forEach(b=>b.onclick=()=>{ collect(); const c=list[+b.dataset.rmc];
    if(picks.some(p=>[p.p1,p.p2,p.p3,p.assigned].map(String).includes(String(c.n))) && !confirm('יש תלמידים שבחרו בחוג הזה. להסיר בכל זאת?')) return;
    list.splice(+b.dataset.rmc,1); redraw(); });
  bindRm();
  $('#addc').onclick = () => { collect(); const n = Math.max(0,...list.map(c=>+c.n||0))+1; list.push({n, name:'', icon:'⭐', desc:'', cap:'', color:C_PALETTE[n%C_PALETTE.length]}); redraw(); };
  $('#savec').onclick = async () => {
    collect();
    if(list.some(c=>!c.name || c.n==='')) return $('#msg').innerHTML='<div class="err">לכל חוג צריך מספר ושם.</div>';
    const ns = list.map(c=>String(c.n)); if(new Set(ns).size!==ns.length) return $('#msg').innerHTML='<div class="err">יש שני חוגים עם אותו מספר.</div>';
    list.forEach(c=>{ if(!c.color) c.color = C_PALETTE[(+c.n||0)%C_PALETTE.length]; });
    await Store.set('gclubs/list', {items:list, updatedAt:nowISO()});
    $('#msg').innerHTML='<div class="ok">הרשימה נשמרה ✓</div>';
  };
  $('#allcsv').onclick = async () => {
    const rows = [['חוג','שם התלמיד/ה','כיתה','עדיפות שהתקבלה']];
    list.forEach(c=>picks.filter(p=>String(p.assigned)===String(c.n)).forEach(p=>{
      const r = String(p.assigned)===String(p.p1)?'1':String(p.assigned)===String(p.p2)?'2':String(p.assigned)===String(p.p3)?'3':'ידני';
      rows.push([c.name, p.child, p.cls||fname(p.folderId), r]); }));
    picks.filter(p=>p.assigned==null).forEach(p=>rows.push(['— לא שובץ —',p.child,p.cls||fname(p.folderId),'']));
    await saveFile('שיבוץ_גוונים_בית_הספר.csv', csvBlob(rows));
  };
  $('#allpdf').onclick = async () => {
    $('#emsg').innerHTML='<div class="note">מייצר PDF…</div>';
    try{ await saveFile('שיבוץ_גוונים_בית_הספר.pdf', await gvanimPdf({name:''}, list, picks.slice().sort((a,b)=>(a.child||'').localeCompare(b.child||'','he'))));
      $('#emsg').innerHTML='<div class="ok">הקובץ הורד ✓</div>'; }
    catch(e){ $('#emsg').innerHTML='<div class="err">יצירת הקובץ נכשלה. נסו שוב.</div>'; }
  };
}

})();
</script>
